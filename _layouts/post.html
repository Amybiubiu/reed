---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags %}<span class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</span>{% endif %}
    </p>
  </header>

  {{ content }}

  <nav class="post-nav" aria-label="文章导航">
    {% if page.next %}
    <div class="post-nav-item">
      <span class="post-nav-label">上一篇</span>
      <a href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a>
    </div>
    {% endif %}
    {% if page.previous %}
    <div class="post-nav-item">
      <span class="post-nav-label">下一篇</span>
      <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a>
    </div>
    {% endif %}
  </nav>
</article>
